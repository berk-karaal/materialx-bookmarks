site_name: materialx-bookmarks
site_description: Demo site for the materialx-bookmarks plugin
site_url: https://berkkaraal.com/materialx-bookmarks/

theme:
  name: materialx
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.top
    - content.code.copy

nav:
  - Home: index.md
  - Tools: tools.md
  - Reading: reading.md
  - Learning: learning.md
  - Two on one page: multiple.md
  - About: about.md

plugins:
  - materialx-bookmarks:
      collections:
        - name: tools
          file: bookmarks/tools.yml
          per_page: 6
          per_page_options: [6, 12, all]
          item_name: tool
          item_name_plural: tools
          tag_sorting: count
          display: blocks
          block_min_width: 14rem
        - name: reading
          file: bookmarks/reading.yml
          per_page: 5
          item_name: blog
          item_name_plural: blogs
          display_options: []
        - name: learning
          file: bookmarks/learning.yml
          per_page: 8
          per_page_options: [8, 16, all]
          item_name: resource
          item_name_plural: resources
          tag_sorting: alphabetical
          display: compact

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences

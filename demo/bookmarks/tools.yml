bookmarks:
  - title: Ruff
    url: https://docs.astral.sh/ruff/
    description: Linter and formatter for Python, written in Rust.
    tags: [python, rust]

  - title: uv
    url: https://docs.astral.sh/uv/
    description: Python package and project manager that replaces pip, venv and pip-tools.
    tags: [python, rust]

  - title: ripgrep
    url: https://github.com/BurntSushi/ripgrep
    description: Recursively searches directories for a regex pattern, respecting gitignore rules.

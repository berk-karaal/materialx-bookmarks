site_name: Fixture
theme:
  name: mkdocs
plugins:
  - materialx-bookmarks:
      collections:
        - name: reading
          file: bookmarks/reading.yml
          per_page: 2
          per_page_options: [2, 4, all]
          block_min_width: 10rem
        - name: projects
          file: bookmarks/projects.yml
          per_page: 10
          item_name: project
          item_name_plural: projects
          tag_sorting: count

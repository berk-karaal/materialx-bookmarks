[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "materialx-bookmarks"
version = "0.1.0"
description = "Bookmark list component for mkdocs-materialx"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mkdocs>=1.5", "pyyaml>=6"]

[project.entry-points."mkdocs.plugins"]
materialx-bookmarks = "materialx_bookmarks.plugin:BookmarksPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/materialx_bookmarks"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

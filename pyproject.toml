[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "materialx-bookmarks"
version = "0.1.0"
description = "Bookmark list component for mkdocs-materialx, with search, tag filtering and pagination"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "berk-karaal" }]
keywords = ["mkdocs", "mkdocs-plugin", "materialx", "bookmarks", "documentation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: MkDocs",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
]
dependencies = ["mkdocs>=1.5", "pyyaml>=6"]

[project.urls]
Homepage = "https://berkkaraal.com/materialx-bookmarks/"
Demo = "https://berkkaraal.com/materialx-bookmarks/"
Source = "https://github.com/berk-karaal/materialx-bookmarks"
Issues = "https://github.com/berk-karaal/materialx-bookmarks/issues"
Changelog = "https://github.com/berk-karaal/materialx-bookmarks/blob/main/CHANGELOG.md"

[project.entry-points."mkdocs.plugins"]
materialx-bookmarks = "materialx_bookmarks.plugin:BookmarksPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/materialx_bookmarks"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
demo = ["mkdocs-materialx>=10.2"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
